name: SwingPulse 24/7 Daily Cloud Engine & Alert Dispatcher

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST (Pre-market scan & Intraday setups)
    - cron: '30 3 * * 1-5'
    # 10:00 UTC = 03:30 PM IST (Post-market review & Swing update)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub mobile app / web

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-daily-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: ⚡ Run Daily Stock Scanner & Recalibration Engine
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE || '919894360810' }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || 'nareshofficial.kumar@gmail.com' }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python agent.py
          python whatsapp_notifier.py || true
          python email_notifier.py || true

      - name: 🚀 Commit and Push Updated Live Market Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/ reports/
          git commit -m "🤖 Auto-update SwingPulse market data [$(date +'%Y-%m-%d %H:%M:%S UTC')]" || echo "No changes to commit"
          git push

      - name: 🌐 Deploy Updated Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: true
